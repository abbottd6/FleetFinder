<div class="note-container">
  <div class="note-element" [class.closing]="noteService.closingIds.has(note.notificationId)">
    <h1>{{ header }}</h1>
    <p>Title: {{ note.title.length >= 30 ? (note.title|slice: 0: 30) + '...' : note.title }}</p>
    <div class="data-row">
      <div>
        <span>{{ message }}</span>
        <span id="note-msg">{{ note.message }}</span>
      </div>
      <div class="ts-container">
        <span class="ts">{{ note.createdAt | date: 'MMM d, h:mm a' }}</span>
      </div>
    </div>
  </div>
  <div class="remove-element" [class.closing]="noteService.closingIds.has(note.notificationId)">
    <button
      id="remove-button"
      (click)="noteService.removeNotification(note.notificationId)">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
