<div class="dropdown-component">
  <label id="planetMoon-dropdown">
    Planet/moon system:
    <mat-icon class="tooltip-icon"
      matTooltip="Optional">
      help_outline
    </mat-icon>
  </label>
  <ng-select
    [items]="filteredPlanetMoons"
    bindLabel="planetName"
    bindValue="planetId"
    [formControl]="planetMoonControl"
    placeholder="Select planet"
    [attr.aria-labelledby]="'planetMoon-dropdown'">
  </ng-select>
</div>
