<div class="button-row">
  <ng-container *ngIf="(layoutMode$ | async) !== 'handheld'; else forHandheld">
    <div class="action-buttons-container">
      <button type="submit" class="action-buttons"
              [disabled]="!(selection.hasValue())"
              (click)="openClearReports(selection.selected[0])">
        Clear Counts
      </button>
      <button class="action-buttons"
              [disabled]="!(selection.hasValue()) || !singleSelected()"
              (click)="openConfirmDelete(selection.selected[0])">
        Mod Delete
      </button>
    </div>
  </ng-container>
  <ng-template #forHandheld>
    <div class="action-buttons-container">
      <button class="action-buttons-with-icons"
              [disabled]="!selection.hasValue()"
              [matMenuTriggerFor]="listingOptionsMenu">
        Options
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #listingOptionsMenu="matMenu">
        <button mat-menu-item class="options-item"
                [disabled]="!(selection.hasValue()) || !singleSelected()"
                (click)="openClearReports(selection.selected[0])">
          Clear Counts
        </button>
        <button mat-menu-item class="options-item"
                [disabled]="!(selection.hasValue() || !singleSelected)"
                (click)="openConfirmDelete(selection.selected[0])">
          Mod Delete
        </button>
      </mat-menu>
    </div>
  </ng-template>
</div>

<div class="mod-table-wrapper">
  <table mat-table
         [dataSource]="dataSource"
         matSort
         (matSortChange)="announceSortChange($event)">

    <!-- Checkbox Column -->
    <ng-container matColumnDef='select'>
      <th mat-header-cell *matHeaderCellDef>
        <!--      <mat-checkbox (change)="$event ? toggleAllRows() : null"-->
        <!--                    [checked]="selection.hasValue() && isAllSelected()"-->
        <!--                    [indeterminate]="selection.hasValue() && !isAllSelected()"-->
        <!--                    [aria-label]="checkboxLabel()">-->
        <!--      </mat-checkbox>-->
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <mat-checkbox (click)="$event.stopPropagation()"
                      (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)"
                      [aria-label]="checkboxLabel(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- USERNAME COLUMN -->
    <ng-container matColumnDef='username'>
      <th mat-header-cell *matHeaderCellDef>
        User
      </th>

      <td mat-cell *matCellDef="let issue; let i = index">
        {{ issue.username }}
      </td>
    </ng-container>

    <!-- USER ID COLUMN -->
    <ng-container matColumnDef='userId'>
      <th mat-header-cell *matHeaderCellDef>
        User ID
      </th>

      <td mat-cell *matCellDef="let issue">
        {{ issue.userId }}
      </td>
    </ng-container>

    <!-- STATUS COLUMN -->
    <ng-container matColumnDef='status'>
      <th mat-header-cell *matHeaderCellDef
          mat-sort-header="status"
          sortActionDescription="Sort by status">
        Status
      </th>

      <td mat-cell *matCellDef="let issue">
        {{ issue.status }}
      </td>
    </ng-container>

    <!-- REPORTS TOTAL COLUMN -->
    <ng-container matColumnDef='reportsTotal'>
      <th mat-header-cell *matHeaderCellDef
          mat-sort-header="reportTotalCount"
          sortActionDescription="Sort by reports total count.">
        Total Reports
      </th>

      <td mat-cell *matCellDef="let issue">
        {{ issue.reportTotalCount }}
      </td>
    </ng-container>

    <!-- FIRST REPORT TS COLUMN -->
    <ng-container matColumnDef='firstR'>
      <th mat-header-cell *matHeaderCellDef
          mat-sort-header="firstReportTs"
          sortActionDescription="Sort by first report timestamp.">
        First Report
      </th>

      <td mat-cell *matCellDef="let issue">
        {{ issue.firstReportTs | date: 'MMM d, h:mm a' }}
      </td>
    </ng-container>

    <!-- LAST REPORT TS COLUMN -->
    <ng-container matColumnDef='lastR'>
      <th mat-header-cell *matHeaderCellDef
          mat-sort-header="lastReportTs"
          sortActionDescription="Sort by last report timestamp.">
        Last Report
      </th>

      <td mat-cell *matCellDef="let issue">
        {{ issue.lastReportTs | date: 'MMM d, h:mm a' }}
      </td>
    </ng-container>

    <ng-container *ngIf="displayedColumns$ | async as displayedColumns">
      <tr mat-header-row class="header-row" *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let issue; columns: displayedColumns"
          (click)="emitClick(issue)"
          (contextmenu)="openContextMenu($event, issue)"
          (touchstart)="onTouchStart($event, issue)"
          (touchend)="onTouchEnd($event)"></tr>
    </ng-container>
  </table>
</div>

<div class="no-results-container" *ngIf="noResults">
  <p>No active moderation issues</p>
</div>

<!-- Paginator -->
<div class="paginator">
  <mat-paginator
    [pageSizeOptions]="[5, 10, 25, 50]"
    [pageIndex]="pageIndex"
    [pageSize]="pageSize"
    [length]="totalElements"
    showFirstLastButtons>
  </mat-paginator>
</div>


<!-- Context Menu -->
<div
  #issuesMenuAnchor
  class="context-menu-anchor"
  [matMenuTriggerFor]="issuesContextMenu"
  #issuesMenuTrigger="matMenuTrigger">
</div>

<mat-menu #issuesContextMenu="matMenu">
  <button
    mat-menu-item
    class="options-item"
    (click)="openDetailedIssue()">
    Detailed
  </button>
</mat-menu>
