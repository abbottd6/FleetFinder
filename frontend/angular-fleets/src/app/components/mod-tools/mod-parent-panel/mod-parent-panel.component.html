<div class="tab-group-container">
  <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
    <mat-tab
      label="Active Issues"
      class="tab-widget">
      <ng-template matTabContent>
        <app-mod-issues-view
          (listingToEmit)="emitChildClick($event)">
        </app-mod-issues-view>
      </ng-template>
    </mat-tab>
    <mat-tab label="Recent Actions">
      <ng-template matTabContent>
        Actions Table
      </ng-template>
    </mat-tab>
    <mat-tab label="User Moderation Records">
      <ng-template matTabContent>
        User Mod records table
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
