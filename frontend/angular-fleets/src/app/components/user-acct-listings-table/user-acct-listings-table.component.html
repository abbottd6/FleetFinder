<table mat-table [dataSource]="dataSource" class="user-table">

  <!-- Checkbox Column -->
  <ng-container matColumnDef='select'>
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox (change)="$event ? toggleAllRows() : null"
                    [checked]="selection.hasValue() && isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()"
                    [aria-label]="checkboxLabel()">
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let row; let i = index">
      <mat-checkbox (click)="$event.stopPropagation()"
                    (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)"
                    [aria-label]="checkboxLabel(row)">
      </mat-checkbox>
    </td>
  </ng-container>

  <!-- Title Column -->
  <ng-container matColumnDef='title'>
    <th mat-header-cell *matHeaderCellDef> Title </th>
    <td mat-cell *matCellDef="let row"> {{row.listingTitle}} </td>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef='status'>
    <th mat-header-cell *matHeaderCellDef> Group Status </th>
    <td mat-cell *matCellDef="let row"> {{row.groupStatus}}</td>
  </ng-container>

  <!-- Category Column -->
  <ng-container matColumnDef='category'>
    <th mat-header-cell *matHeaderCellDef> Category </th>
    <td mat-cell *matCellDef="let row"> {{row.category}}</td>
  </ng-container>

  <!-- PvP Status Column -->
  <ng-container matColumnDef='pvp'>
    <th mat-header-cell *matHeaderCellDef> PvP Status </th>
    <td mat-cell *matCellDef="let row"> {{row.pvpStatus}}</td>
  </ng-container>

  <!-- Planetary System Column -->
  <ng-container matColumnDef='system'>
    <th mat-header-cell *matHeaderCellDef> System </th>
    <td mat-cell *matCellDef="let row"> {{row.system}}</td>
  </ng-container>

  <!-- Available Roles Column -->
  <ng-container matColumnDef='roles'>
    <th mat-header-cell *matHeaderCellDef> Avail. Roles </th>
    <td mat-cell *matCellDef="let row"> {{row.availableRoles}}</td>
  </ng-container>

  <!-- Last Updated TS Column -->
  <ng-container matColumnDef='updated'>
    <th mat-header-cell *matHeaderCellDef> Last Updated </th>
    <td mat-cell *matCellDef="let row"> {{ row.lastUpdated | date: 'MMM d, yyyy h:mm a'}}</td>
  </ng-container>

  <!-- header declarations -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
