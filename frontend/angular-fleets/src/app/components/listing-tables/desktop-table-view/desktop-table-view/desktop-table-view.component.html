<table mat-table [dataSource]="dataSource">
  <!-- Checkbox Column -->
  <ng-container matColumnDef='select'>
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox (change)="$event ? toggleAllRows() : null"
                    [checked]="selection.hasValue() && isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()"
                    [aria-label]="checkboxLabel()">
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let row; let i = index">
      <mat-checkbox (click)="$event.stopPropagation()"
                    (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)"
                    [aria-label]="checkboxLabel(row)">
      </mat-checkbox>
    </td>
  </ng-container>

  <!-- Title Column -->
  <ng-container matColumnDef='title'>
    <th mat-header-cell *matHeaderCellDef> Title</th>
    <td mat-cell *matCellDef="let row" (click)="listingSelected(row)"> {{ row.listingTitle }}</td>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef='status'>
    <th mat-header-cell *matHeaderCellDef> Group Status</th>
    <td mat-cell *matCellDef="let row" (click)="listingSelected(row)"> {{ row.groupStatus }}</td>
  </ng-container>

  <!-- Category Column -->
  <ng-container matColumnDef='category'>
    <th mat-header-cell *matHeaderCellDef> Category</th>
    <td mat-cell *matCellDef="let row" (click)="listingSelected(row)"> {{ row.category }}</td>
  </ng-container>

  <!-- PvP Status Column -->
  <ng-container matColumnDef='pvp'>
    <th mat-header-cell *matHeaderCellDef> PvP Status</th>
    <td mat-cell *matCellDef="let row" (click)="listingSelected(row)"> {{ row.pvpStatus }}</td>
  </ng-container>

  <!-- Planetary System Column -->
  <ng-container matColumnDef='system'>
    <th mat-header-cell *matHeaderCellDef> System</th>
    <td mat-cell *matCellDef="let row" (click)="listingSelected(row)"> {{ row.system }}</td>
  </ng-container>

  <!-- Available Roles Column -->
  <ng-container matColumnDef='roles'>
    <th mat-header-cell *matHeaderCellDef> Avail. Roles</th>
    <td mat-cell *matCellDef="let row" (click)="listingSelected(row)"> {{ row.availableRoles }}</td>
  </ng-container>

  <!-- Last Updated TS Column -->
  <ng-container matColumnDef='updated'>
    <th mat-header-cell *matHeaderCellDef> Last Updated</th>
    <td mat-cell *matCellDef="let row"
        (click)="listingSelected(row)"> {{ row.lastUpdated | date: 'MMM d, h:mm a' }}
    </td>
  </ng-container>

  <!-- header declarations -->
  <ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"
        (contextmenu)="desktopQuickMenu.openContextMenu($event, row)"
        (touchstart)="desktopQuickMenu.onTouchStart($event, row)"
        (touchend)="desktopQuickMenu.onTouchEnd($event)"></tr>
  </ng-container>
</table>

<!-- Context Menu -->
<div
  #desktopMenuAnchor
  class="context-menu-anchor"
  [matMenuTriggerFor]="desktopOptionsMenu"
  #desktopTrigger="matMenuTrigger">
</div>

<mat-menu #desktopOptionsMenu="matMenu">
  <ng-container *ngIf="!(listingInteract.userIsListingOwner() | async); else ownerMenu">
    <button
      mat-menu-item
      class="options-item">
      Message
    </button>
    <button
      mat-menu-item
      class="options-item"
      (click)="listingInteract.hideSelected()">
      Hide
    </button>
    <ng-container *ngIf="(listingInteract.selectedIsBookmarked$ | async) === true; else notBookmarked">
      <button
        mat-menu-item
        class="options-item"
        (click)="listingInteract.deleteSelectedBookmark()">
        Unmark
      </button>
    </ng-container>
    <ng-template #notBookmarked>
      <button mat-menu-item
              class="options-item"
              (click)="listingInteract.bookmarkSelected()">
        Bookmark
      </button>
    </ng-template>
    <button
      mat-menu-item
      class="options-item"
      (click)="listingInteract.reportSelected()">
      Report
    </button>
  </ng-container>
  <ng-template #ownerMenu>
    <button mat-menu-item class="options-item"
            (click)="ownerService.userUpdateSelected(listingInteract.selectedListing!)">
      Update
    </button>
    <button mat-menu-item class="options-item">
      <!-- TODO user save template -->
      Template
    </button>
    <button mat-menu-item class="options-item"
            (click)="ownerService.openConfirmDelete(listingInteract.selectedListing!)">
      Delete
    </button>
  </ng-template>
</mat-menu>
