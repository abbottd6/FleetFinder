<div class="position-chip">
  <div class="position-header" cdkDragHandle [class.has-member]="assignedMember.length > 0">
    <span id="position-drag-handle">
      {{ position.groupRole.roleTitle }}
    </span>
  </div>
  <div class="position-member-slot"
    cdkDropList
    [attr.data-position-id]="position.positionId">
    <div *ngFor="let member of assignedMember"
      cdkDrag
      [cdkDragData]="member">
      <app-member-chip
        [member]="member">
      </app-member-chip>
    </div>
    <ng-container *ngIf="(dropListRegistry.hoveredPositionId$ | async) === position.positionId">
      <div class="member-drop-placeholder">
        <app-member-chip
          [member]="dropListRegistry.draggedMember$.getValue()!">
        </app-member-chip>
      </div>
    </ng-container>
  </div>
</div>
