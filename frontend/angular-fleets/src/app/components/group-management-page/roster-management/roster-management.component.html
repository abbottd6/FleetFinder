<div class="roster-top-buttons-container">
  <button class="action-buttons-with-icons"
          [routerLink]="'/user-account'">
    <mat-icon>arrow_back</mat-icon>
    Back to Profile
  </button>
</div>
<h5 class="subgroup-header">
  Roster
</h5>
<mat-tab-group class="tab-group-container"
               mat-stretch-tabs="false"
               mat-align-tabs="center"
               (selectedTabChange)="onTabSwitch($event)">

  <mat-tab
    label="Active"
    class="tab-widget">
    <ng-template matTabContent>
      <ng-container *ngIf="(selectedTab$ | async) === RosterTabOptions.Active">
        <app-active-roster-panel
          [groupId]="groupId">
        </app-active-roster-panel>
      </ng-container>
    </ng-template>
  </mat-tab>
  <mat-tab
    label="Invites"
    class="tab-widget">
    <ng-template matTabContent>
      <ng-container *ngIf="(selectedTab$ | async) === RosterTabOptions.Invite">
        <app-roster-invite-panel
          [groupId]="groupId">
        </app-roster-invite-panel>
      </ng-container>
    </ng-template>
  </mat-tab>
  <mat-tab
    label="Waitlist"
    class="tab-widget">
    <ng-template matTabContent>
      <ng-container *ngIf="(selectedTab$ | async) === RosterTabOptions.Waitlist">
        <app-waitlist-roster-panel
          [groupId]="groupId">
        </app-waitlist-roster-panel>
      </ng-container>
    </ng-template>
  </mat-tab>
</mat-tab-group>
