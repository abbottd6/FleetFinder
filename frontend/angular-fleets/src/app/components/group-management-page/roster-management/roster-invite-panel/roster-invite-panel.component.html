<div class="panel-wrapper">
  <app-invite-options-panel
    [inviteFilterState$]="inviteFilterState$"
    (emitFilterState)="catchFilterStateChange($event)">
  </app-invite-options-panel>
  <app-roster-text-field-filter
    [placeholder]="'Filter by username...'"
    [textFieldFilterCtrl]="filterTermsCtrl">
  </app-roster-text-field-filter>
  <div class="proliferation-container">
    <ng-container *ngFor="let invite of (invitesForDisplay$ | async)">
      <app-invite-chip
        [invite]="invite"
        (inviteActionEmitter)="changeInviteStatus($event)"
        (messageRequestEmitter)="managementInteract.openConversation($event)"
        (contextmenu)="invitesQuickMenu.openContextMenu($event, invite)"
        (touchstart)="invitesQuickMenu.onTouchStart($event, invite)"
        (touchend)="invitesQuickMenu.onTouchEnd($event)">
      </app-invite-chip>
    </ng-container>
    @if((invitesForDisplay$ | async)?.length === 0) {
      <span class="invites-empty-message">No matching invites</span>
    }
  </div>
</div>
<div class="bottom-button-container">
  <button class="action-buttons"
          (click)="managementInteract.openSendInvitePopup(managementInteract.sessionManager!, null)">
    Send Invite
  </button>
</div>

<!-- Context Menu -->
<div
  #contextMenuAnchor
  class="context-menu-anchor"
  [matMenuTriggerFor]="inviteOptionsMenu"
  #menuTrigger="matMenuTrigger">
</div>

<mat-menu #inviteOptionsMenu="matMenu">

  <ng-container *ngIf="(managementInteract.selectedInvite$ | async) as invite">
    <ng-container *ngIf="invite.inviteStatus === 'PENDING'; else actioned">
      <ng-container *ngIf="invite.inviteDirection === 'OFFER'; else requestMenu">
        <button
          mat-menu-item
          class="options-item"
          (click)="managementInteract.openConversation(invite.recipientSummary)">
          <mat-icon class="material-symbols-outlined dropdown-icon">
            chat_bubble
          </mat-icon>
          Message
        </button>
        <button
          mat-menu-item
          class="options-item"
          (click)="changeInviteStatus({action: InviteActions.RESCIND, invite: invite})">
          <mat-icon class="material-symbols-outlined dropdown-icon">
            undo
          </mat-icon>
          Rescind
        </button>
      </ng-container>
      <ng-template #requestMenu>
        <button
          mat-menu-item
          class="options-item"
          (click)="managementInteract.openConversation(invite.recipientSummary)">
          <mat-icon class="material-symbols-outlined dropdown-icon">
            chat_bubble
          </mat-icon>
          Message
        </button>

        <button
          mat-menu-item
          class="options-item"
          (click)="changeInviteStatusFromQuckMenu(InviteActions.ACCEPT, invite)">
          <mat-icon class="material-symbols-outlined dropdown-icon">
            check_circle
          </mat-icon>
          Accept
        </button>

        <button
          mat-menu-item
          class="options-item"
          (click)="changeInviteStatusFromQuckMenu(InviteActions.DECLINE, invite)">
          <mat-icon class="material-symbols-outlined dropdown-icon">
            cancel
          </mat-icon>
          Decline
        </button>

        <button
          mat-menu-item
          class="options-item"
          (click)="altInviteActionFromQuickMenu(InviteActions.WAITLIST, invite)">
          <mat-icon class="material-symbols-outlined waitlist-icon">
            acute
          </mat-icon>
          Waitlist
        </button>

        <button
          mat-menu-item
          class="options-item"
          (click)="altInviteActionFromQuickMenu(InviteActions.BLOCK, invite)">
          <mat-icon class="material-symbols-outlined dropdown-icon">
            block
          </mat-icon>
          Block User
        </button>
      </ng-template>
    </ng-container>
    <ng-template #actioned>
      <button
        mat-menu-item
        class="options-item"
        (click)="managementInteract.openConversation(invite.recipientSummary)">
        <mat-icon class="material-symbols-outlined dropdown-icon">
          chat_bubble
        </mat-icon>
        Message
      </button>
      <button
        mat-menu-item
        class="options-item"
        (click)="altInviteActionFromQuickMenu(InviteActions.DISMISS, invite)">
        <mat-icon class="material-symbols-outlined dropdown-icon">
          cancel
        </mat-icon>
        Dismiss
      </button>
      <ng-container *ngIf="invite.inviteDirection === 'REQUEST'">
        <button
          mat-menu-item
          class="options-item"
          (click)="altInviteActionFromQuickMenu(InviteActions.BLOCK, invite)">
          <mat-icon class="material-symbols-outlined dropdown-icon">
            block
          </mat-icon>
          Block User
        </button>
      </ng-container>
    </ng-template>
  </ng-container>
</mat-menu>
