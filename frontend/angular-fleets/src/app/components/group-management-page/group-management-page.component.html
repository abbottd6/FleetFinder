<div class="body-container">
  <span class="page-title">Group Management</span>
  <ng-container *ngIf="!pageIsLoading; else loading">
    <div class="management-container" #managementContainer [style.min-height]="containerHeight">
      <div class="roster-container">
        <app-roster-management>
        </app-roster-management>
      </div>
      <div class="subgroup-management-container">
        <div class="group-header-container">
          <span class="listing-title">{{ listingTitle.length > 60 ? (listingTitle|slice: 0: 60) + '...' : listingTitle }}</span>
        </div>

        <div class="subgroups-button-header-row">

          <div class="button-group-left">
            <button class="secondary-action-buttons"
              (click)="toggleDoNotShowCreateFrom()">
              Load Ship Template
            </button>

            <button class="secondary-action-buttons"
              (click)="toggleDoNotShowSaveAsForm()">
              Save As Template
            </button>
          </div>
        </div>
          <div class="expansion-form-container">
            <app-load-crew-template-form
              [class.do-not-show-form]="doNotShowCreateFromTemplateForm"
              [class.show-form]="!doNotShowCreateFromTemplateForm"
              [class.expanding]="createFromIsExpanding"
              class="from-template"
              (cancelForm)="toggleDoNotShowCreateFrom()"
              (emitSelection)="createFromTemplate($event)">
            </app-load-crew-template-form>

          <div class="expansion-form-container">
            <!-- save structure as template -->
          </div>
        </div>

        <div class="group-composition-container">
          <ng-container *ngIf="(subgroupMgmtInteract.subgroupTrees$ | async) as subgroups">
            <app-crew-subgroup
              *ngFor="let treeRoot of subgroups"
              [subgroup]="treeRoot">
            </app-crew-subgroup>
          </ng-container>

          <button class="add-new-button">
            <mat-icon class="material-symbols-outlined add-2" style="font-variation-settings: 'wght' 300;">add_circle_outline</mat-icon>
          </button>
        </div>

      </div>
    </div>
  </ng-container>
  <ng-template #loading>
    <div class="mat-spinner-container">
      <mat-spinner></mat-spinner>
    </div>
  </ng-template>
</div>
