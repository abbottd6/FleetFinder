<mat-dialog-content class="message-container">
  <div class="message-body"
       [innerHTML]="data.message">
  </div>
  <div>
    <mat-checkbox
      class="checkbox-element"
      [formControl]="dontShowMe">
      Don't show me this message again.
    </mat-checkbox>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button class="action-buttons" (click)="onConfirm()">Confirm</button>
</mat-dialog-actions>
