<h2 mat-dialog-title>Select the basis for the report:</h2>
<mat-dialog-content>
  <div class="dropdown-component">
    <ng-select
      [items]="data.options"
      [formControl]="reportBasisCtrl"
      bindLabel="option"
      bindValue="id"
      placeholder="Report category..."
      [attr.aria-labelledby]="'Principal Filter'"
      [appendTo]="'.cdk-overlay-container'">
    </ng-select>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button class="action-buttons" (click)="onCancel()">Cancel</button>
  <button mat-button class="action-buttons" (click)="onConfirm()">Submit</button>
</mat-dialog-actions>
