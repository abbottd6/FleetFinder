<h2 mat-dialog-title>Please confirm deletion of:</h2>
<mat-dialog-content>
  <ul>
    <li *ngFor="let row of data.rows">{{ row.listingTitle }}</li>
  </ul>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button class="action-buttons" (click)="onCancel()">Cancel</button>
  <button mat-button class="action-buttons" (click)="onConfirm()">Delete</button>
</mat-dialog-actions>
