<div class="form-wrapper">
  <div *ngIf="browserIncompatibilityMessage" class="error-message">
    <span>{{ browserIncompatibilityMessage }}</span>
  </div>
  <app-generic-small-input-field
    class="form-row"
    [label]="'Device Name:'"
    [errorLabel]="'Device Name'"
    [min]="3"
    [max]="32"
    [inputCtrl]="pushSubInputCtrl"
    [placeholder]="'Chrome on my PC...'">
  </app-generic-small-input-field>
  <ng-container *ngIf="showFormErrorMessage as message">
    <div class="error-message">
      <span>{{ showFormErrorMessage }}</span>
    </div>
  </ng-container>
  <div class="button-row">
    <button class="action-buttons"
      (click)="(emitCancelClick())">
      Cancel
    </button>
    <button class="action-buttons"
      (click)="enablePushNotifications()">
      Subscribe
    </button>
  </div>
</div>
