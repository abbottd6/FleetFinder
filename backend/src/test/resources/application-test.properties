spring.application.name=FleetsApplicationTests

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/sc_fleetfinder?serverTimezone=UTC
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}

spring.task.scheduling.pool.size=1

##repository detection strategy
spring.data.rest.detection-strategy=ANNOTATED

##DB migration
spring.flyway.enabled=false
spring.flyway.locations=filesystem:src/main/resources/migration,filesystem:src/test/resources/migration
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.cache.type=none

spring.jpa.hibernate.ddl-auto=update

spring.data.rest.base-path=/testApi

allowed.origins=*

discord.bot.token=TEST_DISCORD_BOT_TOKEN

vapid.public.key=TEST_VAPID_PUBLIC_KEY
vapid.private.key=TEST_VAPID_PRIVATE_KEY

logging.level.org.springframework=DEBUG